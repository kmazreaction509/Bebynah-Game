<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff69b4">
<title>Ti Princess - Aprann pandan w ap jwe</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:#fff0f7;color:#57234b;text-align:center}
header{background:linear-gradient(135deg,#ff69b4,#9b59b6);color:white;padding:25px 12px;padding-top:calc(25px + env(safe-area-inset-top,0px));border-radius:0 0 30px 30px}
header h1{font-size:30px;margin:5px}
header p{margin:5px}
.stars{background:#fff;color:#a64d91;border-radius:25px;padding:9px 17px;display:inline-block;margin-top:10px;font-weight:bold}
main{max-width:650px;margin:auto;padding:18px}
h2{color:#a33c91}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{border:0;border-radius:20px;padding:17px 10px;font-size:18px;font-weight:bold;cursor:pointer;color:#63305d;box-shadow:0 4px 8px #00000015}
.menu button{min-height:110px;background:white}
.menu button:last-child{grid-column:1/-1}
.menu button span{display:block;font-size:35px;margin-bottom:8px}
button:active{transform:scale(.97)}
#game{display:none;background:white;border-radius:25px;padding:20px;margin-top:18px;min-height:300px}
#question{font-size:25px;font-weight:bold;margin:15px}
#display{font-size:75px;margin:15px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.answers button{background:#ffe0f0;font-size:27px;min-height:70px}
#feedback{font-size:22px;font-weight:bold;min-height:35px;margin:15px}
.back{background:#e9d5f5;margin-top:15px}
.listen{background:#d6ecff;margin:5px 0 10px}
#mute{background:#fff;color:#a64d91;margin-left:8px;padding:8px 14px;font-size:18px;border-radius:25px}
footer{padding:20px;color:#a06a91;font-size:13px}
@media(max-width:350px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>👑 Ti Princess 👑</h1>
<p>Aprann pandan w ap jwe!</p>
<div class="stars">⭐ Zetwal mwen: <span id="stars">0</span></div><button id="mute" onclick="toggleVoice()">🔊</button>
</header>
<main>
<h2>Bonjou, ti prensès! 💖</h2>
<p>Ki sa ou ta renmen aprann jodi a?</p>
<div class="menu" id="menu">
<button onclick="start('letters')"><span>🔤</span>Alfabè</button>
<button onclick="start('numbers')"><span>🔢</span>Chif yo</button>
<button onclick="start('colors')"><span>🎨</span>Koulè yo</button>
<button onclick="start('animals')"><span>🐶</span>Bèt yo</button>
<button onclick="start('shapes')"><span>🔺</span>Fòm yo</button>
<button onclick="start('words')"><span>📖</span>Mo yo</button>
<button onclick="start('mix')"><span>🎁</span>Ti tès mwen</button>
</div>
<section id="game">
<div id="question"></div>
<div id="display"></div>
<button class="listen" onclick="speakQuestion()">🔊 Tande</button>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button onclick="nextQuestion()" id="next" style="display:none;background:#b9f3ce">Kontinye ➜</button>
<br>
<button class="back" onclick="home()">🏠 Retounen lakay</button>
</section>
</main>
<footer>Made with ❤️ pou ti prensès yo.</footer>
<script>
let voiceOn=true;
function pickVoice(){
const v=speechSynthesis.getVoices();
return v.find(x=>x.lang.toLowerCase().startsWith("ht"))||v.find(x=>x.lang.toLowerCase().startsWith("fr"))||null;
}
function slug(t){
return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
let seqId=0,curAudio=null;
function playFile(url){
return new Promise(res=>{
let done=false;
const fin=v=>{if(!done){done=true;res(v);}};
try{
const a=new Audio(url);
curAudio=a;
a.onended=()=>fin(true);
a.onerror=()=>fin(false);
a.play().catch(()=>fin(false));
}catch(e){fin(false);}
});
}
function ttsOne(t){
return new Promise(res=>{
if(!("speechSynthesis" in window)){res();return;}
try{
const u=new SpeechSynthesisUtterance(t);
const v=pickVoice();
if(v){u.voice=v;u.lang=v.lang;}else{u.lang="fr-FR";}
u.rate=.85;u.pitch=1.3;
u.onend=u.onerror=()=>res();
speechSynthesis.speak(u);
setTimeout(res,6000);
}catch(e){res();}
});
}
async function playOne(t){
const name=slug(t);
for(const ext of ["mp3","m4a","ogg","wav"]){
if(await playFile("audio/"+name+"."+ext))return;
}
await ttsOne(t);
}
function stopVoice(){
seqId++;
try{if(curAudio)curAudio.pause();}catch(e){}
if("speechSynthesis" in window)speechSynthesis.cancel();
}
async function speak(...list){
if(!voiceOn)return;
stopVoice();
const id=seqId;
for(const t of list){
if(id!==seqId)return;
await playOne(t);
}
}
function speakQuestion(){
if(!current.length)return;
let q=current[index];
speak(q[5]||q[0]);
}
function toggleVoice(){
voiceOn=!voiceOn;
document.getElementById("mute").textContent=voiceOn?"🔊":"🔇";
if(!voiceOn)stopVoice();
}
let ac;
function tone(freqs){
try{
ac=ac||new (window.AudioContext||window.webkitAudioContext)();
freqs.forEach((f,i)=>{
const o=ac.createOscillator(),g=ac.createGain();
o.frequency.value=f;o.connect(g);g.connect(ac.destination);
const t=ac.currentTime+i*.15;
g.gain.setValueAtTime(.2,t);
g.gain.exponentialRampToValueAtTime(.001,t+.14);
o.start(t);o.stop(t+.15);
});
}catch(e){}
}

/* ====== DONE YO (modifye isit pou ajoute plis) ====== */
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const COLORS=[["🔴","Wouj"],["🔵","Ble"],["🟡","Jòn"],["🟢","Vèt"],["🟠","Oranj"],["🟣","Vyolèt"],["🟤","Mawon"],["⚫","Nwa"],["⚪","Blan"],["💗","Woz"]];
const ANIMALS=[["🐶","Chen"],["🐱","Chat"],["🐄","Bèf"],["🐐","Kabrit"],["🐑","Mouton"],["🐷","Kochon"],["🐔","Poul"],["🐴","Chwal"],["🦆","Kanna"],["🐰","Lapen"],["🐭","Rat"],["🐦","Zwazo"],["🐟","Pwason"],["🐢","Tòti"],["🐍","Koulèv"],["🐸","Krapo"],["🦋","Papiyon"],["🐝","Myèl"],["🐜","Foumi"],["🦃","Kodenn"],["🐒","Makak"],["🦁","Lyon"],["🐘","Elefan"],["🐊","Kokodil"]];
const SHAPES=[["🔴","Sèk"],["🟦","Kare"],["🔺","Triyang"],["▭","Rektang"]];
const OBJECTS=[["🏠","Kay"],["💧","Dlo"],["🍞","Pen"],["📖","Liv"],["⚽","Bal"],["☀️","Solèy"],["🌙","Lalin"],["🍎","Pòm"],["🍌","Bannann"],["🎂","Gato"],["🍬","Bonbon"],["👟","Soulye"],["🚗","Machin"],["🚌","Bis"],["🌸","Flè"],["🌳","Pye bwa"],["🥭","Mango"],["🥚","Ze"]];
const FAMILY=["Papa","Manman","Tati","Tonton","Granpapa","Grann","Frè","Sè","Ti moun","Bebe","Zanmi"];
const THINGS=[["🍎","pòm"],["⭐","zetwal"],["🎈","balon"],["🐟","pwason"],["🍌","bannann"],["🌸","flè"]];

const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const pick=(a,n)=>shuffle(a).slice(0,n);
const R=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function opts(correct,pool){
const others=shuffle(pool.filter(x=>x!==correct)).slice(0,3);
return shuffle([correct,...others]);
}
function around(n,r,min,max){
const p=[];
for(let d=-r;d<=r;d++){const v=n+d;if(v>=min&&v<=max)p.push(String(v));}
return p;
}
/* chak kesyon: [kesyon, sa ki montre, chwa yo, bon repons, sa vwa a di, sa vwa a li pou kesyon an] */
function qLetters(){return LETTERS.map(l=>["Ki lèt sa a?",l,opts(l,LETTERS),l,l]);}
function qColors(){return COLORS.map(([e,n])=>["Ki koulè sa a?",e,opts(n,COLORS.map(c=>c[1])),n,n]);}
function qAnimals(k){return pick(ANIMALS,k).map(([e,n])=>["Ki bèt sa a?",e,opts(n,ANIMALS.map(c=>c[1])),n,n]);}
function qShapes(){return SHAPES.map(([e,n])=>["Ki fòm sa a?",e,opts(n,SHAPES.map(c=>c[1])),n,n]);}
function qNumbers(){
const out=[];
for(let i=0;i<8;i++){
const n=i<4?rnd(1,20):rnd(21,100);
out.push(["Ki chif sa a?",String(n),opts(String(n),around(n,10,1,100)),String(n),String(n)]);
}
for(let i=0;i<4;i++){
const [e,w]=R(THINGS);const n=rnd(1,10);
out.push(["Konbyen "+w+" ki genyen?",e.repeat(n),opts(String(n),around(n,5,1,12)),String(n),String(n)]);
}
for(let i=0;i<3;i++){
const n=rnd(1,99);
out.push(["Ki nimewo ki vini apre sa a?",String(n),opts(String(n+1),around(n+1,6,1,100)),String(n+1),String(n+1)]);
}
return out;
}
function qWords(){
const out=[];
pick(OBJECTS,4).forEach(([e,w])=>out.push(["Ki mo sa a?",e,opts(w,OBJECTS.map(o=>o[1])),w,w]));
pick(OBJECTS,3).forEach(([e,w])=>out.push(["Ki imaj ki ale ak mo sa a?",w,opts(e,OBJECTS.map(o=>o[0])),e,w]));
const all=[...FAMILY,...OBJECTS.map(o=>o[1])];
pick(FAMILY,6).forEach(w=>out.push(["Tande epi chwazi mo a","🔊",opts(w,all),w,w,w]));
return out;
}
const builders={letters:qLetters,numbers:qNumbers,colors:qColors,animals:()=>qAnimals(10),shapes:qShapes,words:qWords};

let current=[],index=0,score=0,stars=0;
try{stars=Number(localStorage.getItem("princessStars")||0);}catch(e){}
document.getElementById("stars").textContent=stars;
function start(type){
if(type==="mix"){
current=shuffle([...qLetters(),...qNumbers(),...qColors(),...qAnimals(6),...qShapes(),...qWords()]).slice(0,15);
}else{
current=shuffle(builders[type]());
}
index=0;score=0;
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
showQuestion();
}
function showQuestion(){
let q=current[index];
document.getElementById("question").textContent=q[0];
const d=document.getElementById("display");
d.textContent=q[1];
const len=[...q[1]].length;
d.style.fontSize=len>8?"38px":(len>3?"50px":"75px");
document.getElementById("feedback").textContent="";
document.getElementById("next").style.display="none";
let correct=q[3];
let area=document.getElementById("answers");
area.innerHTML="";
shuffle(q[2]).forEach(choice=>{
let b=document.createElement("button");
b.textContent=choice;
b.onclick=()=>answer(choice,correct,q[4]);
area.appendChild(b);
});
setTimeout(speakQuestion,300);
}
function answer(choice,correct,say){
let buttons=document.querySelectorAll(".answers button");
buttons.forEach(b=>b.disabled=true);
if(choice===correct){
document.getElementById("feedback").textContent="🎉 Bravo! Ou jwenn yon zetwal! ⭐";
score++;stars++;
tone([660,880,1100]);
speak("Bravo",say||correct);
try{localStorage.setItem("princessStars",stars);}catch(e){}
document.getElementById("stars").textContent=stars;
}else{
document.getElementById("feedback").textContent="😊 Eseye ankò! Bon kouraj!";
tone([300,220]);
speak("Eseye ankò");
}
document.getElementById("next").style.display="inline-block";
document.getElementById("next").textContent=index===current.length-1?"Gade rezilta 🏆":"Kontinye ➜";
}
function nextQuestion(){
index++;
if(index>=current.length){
document.getElementById("question").textContent="🎉 Ou fini!";
document.getElementById("display").textContent="🏆";
document.getElementById("display").style.fontSize="75px";
document.getElementById("answers").innerHTML="";
document.getElementById("feedback").textContent="Ou jwenn "+score+" bon repons sou "+current.length+". Mwen fyè de ou!";
document.getElementById("next").style.display="none";
tone([523,659,784,1047]);
speak("Ou fini");
return;
}
showQuestion();
}
function home(){
stopVoice();
document.getElementById("game").style.display="none";
document.getElementById("menu").style.display="grid";
}
</script>
</body>
</html>
